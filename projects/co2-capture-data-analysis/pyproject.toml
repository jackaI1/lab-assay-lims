[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "co2-capture-data-analysis"
version = "0.1.0"
description = "Traceable CO2 breakthrough and electrochemical cycle analysis"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0,<3", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
co2-analyze = "co2_analysis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/co2_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "C4", "RUF100"]

