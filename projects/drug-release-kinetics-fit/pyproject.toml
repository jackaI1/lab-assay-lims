[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drug-release-kinetics-fit"
version = "0.1.0"
description = "Compare cumulative release models with range checks and bootstrap uncertainty"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
release-fit = "drug_release.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/drug_release"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
