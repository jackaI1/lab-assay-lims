[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-cluster-scheduler"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["simpy>=4.1,<5"]

[project.optional-dependencies]
test = ["pytest>=7,<9", "hypothesis>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
