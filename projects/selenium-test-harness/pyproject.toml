[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selenium-test-harness"
version = "0.1.0"
description = "Repeatable browser-driven bench supply checks with JSON results"
requires-python = ">=3.11"
dependencies = ["selenium>=4.27,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[project.scripts]
instrument-sweep = "instrument_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/instrument_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: drives a real headless Chrome session"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/instrument_harness"]
