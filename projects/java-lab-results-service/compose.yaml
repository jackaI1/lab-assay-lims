services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: labresults
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/setup-demo.sh first}
    volumes:
      - lab-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U lab -d labresults']
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 384m
  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:postgresql://db:5432/labresults
      DB_USER: lab
      DB_PASSWORD: ${DB_PASSWORD:?Run scripts/setup-demo.sh first}
      READER_PASSWORD: ${READER_PASSWORD:?Run scripts/setup-demo.sh first}
      TECHNICIAN_PASSWORD: ${TECHNICIAN_PASSWORD:?Run scripts/setup-demo.sh first}
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:8080'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/health']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    mem_limit: 640m
volumes:
  lab-data:
