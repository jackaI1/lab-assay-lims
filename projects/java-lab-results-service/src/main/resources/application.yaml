spring:
  flyway:
    locations: ${lab.migrations:classpath:db/migration}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/labresults}
    username: ${DB_USER:lab}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    datatype:
      enum:
        fail-on-numbers-for-enums: true
  mvc:
    problemdetails:
      enabled: true
server:
  error:
    include-message: never
    include-stacktrace: never
lab:
  security:
    reader-password: ${READER_PASSWORD:}
    technician-password: ${TECHNICIAN_PASSWORD:}
