[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eeg-session-qc"
version = "0.1.0"
description = "Explainable EEG recording quality screening on public data"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9,<4",
    "mne>=1.10,<2",
    "numpy>=2,<3",
    "scikit-learn>=1.6,<2",
    "scipy>=1.15,<2",
]

[project.scripts]
eeg-qc = "eeg_session_qc.cli:main"

[dependency-groups]
dev = [
    "edfio>=0.4,<1",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
