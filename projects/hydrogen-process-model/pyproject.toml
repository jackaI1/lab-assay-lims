[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "hydrogen-process-model"
version = "0.1.0"
description = "Steam methane reforming and electrolysis comparison for hydrogen cost and energy use"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cantera>=3.1,<4",
    "numpy>=1.26,<3",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
h2-compare = "process_model.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/process_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
