[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clinical-image-quality-gate"
version = "0.1.0"
description = "Reproducible synthetic photo quality gating benchmark"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "Pillow==11.3.0",
    "scipy==1.16.3",
    "scikit-learn==1.6.1",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.3"]

[project.scripts]
image-qc = "image_qc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/image_qc"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
