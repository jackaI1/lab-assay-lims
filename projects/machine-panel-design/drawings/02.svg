troke="black" stroke-width="1.3"/><rect x="52" y="35" width="26" height="14" fill="none" stroke="black"/></g><g transform="translate(610,490)"><rect x="0" y="0" width="130" height="96" fill="none" stroke="black"/><text x="7" y="18" font-size="13.0" fill="black">B1</text><text x="0" y="110" font-size="9.1" fill="black">SK 3237124</text><path d="M-12,42 L0,42" fill="none" stroke="black" stroke-width="1.3"/><text x="3" y="37" font-size="9.1" fill="black">V+</text><path d="M-12,70 L0,70" fill="none" stroke="black" stroke-width="1.3"/><text x="3" y="65" font-size="9.1" fill="black">GND</text><ellipse cx="65.0" cy="39.0" rx="14.0" ry="14.0" fill="none" stroke="black"/><text x="57.0" y="45" font-size="11.700000000000001" fill="black">F</text></g><g transform="translate(900,518)"><rect x="0" y="0" width="100" height="70" fill="none" stroke="black"/><text x="7" y="13" font-size="10.4" fill="black">0V / 01</text><path d="M-12,42 L0,42" fill="none" stroke="black" stroke-width="1.3"/><text x="3" y="37" font-size="9.1" fill="black">0V</text></g><g transform="translate(70,690)"><rect x="0" y="0" width="100" height="70" fill="none" stroke="black"/><text x="7" y="13" font-size="10.4" fill="black">0V / 01,03,04</text><path d="M112,42 L100,42" fill="none" stroke="black" stroke-width="1.3"/><text x="52" y="37" font-size="9.1" fill="black">0V</text></g><g transform="translate(610,690)"><rect x="0" y="0" width="100" height="70" fill="none" stroke="black"/><text x="7" y="13" font-size="10.4" fill="black">PE / 01 PE:DC-</text><text x="7" y="25" font-size="10.4" fill="black">BOND</text><path d="M-12,42 L0,42" fill="none" stroke="black" stroke-width="1.3"/><text x="3" y="37" font-size="9.1" fill="black">PE</text></g><g transform="translate(0,0)"><text x="35" y="38" font-size="23.400000000000002" fill="black">BOTTLE FILLER / 02 / 24 V DC distribution and bonding</text><text x="35" y="68" font-size="13.0" fill="black">Revision B | Jack Lai | Simulation / engineering study | 2026-11-05</text><text x="35" y="850" font-size="13.0" fill="black">PS1 is fed line-to-line at 208 V (01). 24 V / 2.5 A supply; all field loads included in DC budget.</text><text x="35" y="875" font-size="13.0" fill="black">F4: 1 A PLC; F3: 2 A control/field; F5: 2 A fan. Control conductors: 18 AWG Cu design choice.</text><text x="35" y="900" font-size="13.0" fill="black">0 V has one intentional bond to PE at the DC distribution terminal; protective earth stays continuous.</text><text x="35" y="925" font-size="13.0" fill="black">PLC V+ and GND power logic only. Relay output commons are separately wired on 04.</text><text x="35" y="950" font-size="13.0" fill="black">B1 is continuously supplied. EF1/EF2 outlets give 16 m3/h installed, not 20 free-air.</text><path d="M35,825 L1390,825" fill="none" stroke="black" stroke-width="1.3"/><text x="35" y="1025" font-size="11.700000000000001" fill="black">Reference conductors by net name across sheets. Crossings have no junction unless they share a terminal.</text></g><path d="M182,152 L298,152" fill="none" stroke="black" stroke-width="1.4"/><circle cx="182" cy="152" r="2.1" fill="black"/><circle cx="298" cy="152" r="2.1" fill="black"/><text x="240.0" y="147" font-size="9" fill="#444">24RAW</text><path d="M452,152 L598,152" fill="none" stroke="black" stroke-width="1.4"/><circle cx="452" cy="152" r="2.1" fill="black"/><circle cx="598" cy="152" r="2.1" fill="black"/><text x="525.0" y="147" font-size="9" fill="#444">24PLC</text><path d="M598,180 L888,180" fill="none" stroke="black" stroke-width="1.4"/><circle cx="598" cy="180" r="2.1" fill="black"/><circle cx="888" cy="180" r="2.1" fill="black"/><text x="743.0" y="175" font-size="9" fill="#444">0V</text><path d="M182,342 L298,342" fill="none" stroke="black" stroke-width="1.4"/><circle cx="182" cy="342" r="2.1" fill="black"/><circle cx="298" cy="342" r="2.1" fill="black"/><text x="240.0" y="337" font-size="9" fill="#444">24RAW</text><path d="M452,342 L558,342" fill="none" stroke="black" stroke-width="1.4"/><circle cx="452" cy="342" r="2.1" fill="black"/><circle cx="558" cy="342" r="2.1" fill="black"/><text x="505.0" y="337" font-size="9" fill="#444">24CTL</text><path d="M182,532 L298,532" fill="none" stroke="black" stroke-width="1.4"/><circle cx="182" cy="532" r="2.1" fill="black"/><circle cx="298" cy="532" r="2.1" fill="black"/><text x="240.0" y="527" font-size="9" fill="#444">24RAW</text><path d="M452,532 L598,532" fill="none" stroke="black" stroke-width="1.4"/><circle cx="452" cy="532" r="2.1" fill="black"/><circle cx="598" cy="532" r="2.1" fill="black"/><text x="525.0" y="527" font-size="9" fill="#444">24FAN</text><path d="M598,560 L888,560" fill="none" stroke="black" stroke-width="1.4"/><circle cx="598" cy="560" r="2.1" fill="black"/><circle cx="888" cy="560" r="2.1" fill="black"/><text x="743.0" y="555" font-size="9" fill="#444">0V</text><path d="M182,732 L470,732 L598,732" fill="none" stroke="black" stroke-width="1.4"/><circle cx="182" cy="732" r="2.1" fill="black"/><circle cx="598" cy="732" r="2.1" fill="black"/></g></svg>
