sform="translate(230,570)"><rect x="0" y="0" width="70" height="45" fill="none" stroke="black"/><text x="7" y="18" font-size="13.0" fill="black">X1</text></g><g transform="translate(335,625)"><rect x="0" y="0" width="90" height="45" fill="none" stroke="black"/><text x="7" y="18" font-size="13.0" fill="black">X2</text></g><g transform="translate(155,640)"><rect x="0" y="0" width="70" height="45" fill="none" stroke="black"/><text x="7" y="18" font-size="13.0" fill="black">PE</text></g><g transform="translate(680,230)"><rect x="0" y="0" width="30" height="30" fill="none" stroke="black"/><text x="7" y="18" font-size="13.0" fill="black">S0</text></g><g transform="translate(760,230)"><rect x="0" y="0" width="30" height="30" fill="none" stroke="black"/><text x="7" y="18" font-size="13.0" fill="black">S1</text></g><g transform="translate(840,230)"><rect x="0" y="0" width="30" height="30" fill="none" stroke="black"/><text x="7" y="18" font-size="13.0" fill="black">S2</text></g><g transform="translate(920,230)"><rect x="0" y="0" width="30" height="30" fill="none" stroke="black"/><text x="7" y="18" font-size="13.0" fill="black">S3</text></g><g transform="translate(760,330)"><rect x="0" y="0" width="30" height="30" fill="none" stroke="black"/><text x="7" y="18" font-size="13.0" fill="black">H1</text></g><g transform="translate(1120,520)"><rect x="0" y="0" width="117" height="117" fill="none" stroke="black"/><text x="7" y="18" font-size="13.0" fill="black">B1</text></g><g transform="translate(1120,160)"><rect x="0" y="0" width="117" height="117" fill="none" stroke="black"/><text x="7" y="18" font-size="13.0" fill="black">EF1</text></g><g transform="translate(1120,330)"><rect x="0" y="0" width="117" height="117" fill="none" stroke="black"/><text x="7" y="18" font-size="13.0" fill="black">EF2</text></g><g transform="translate(0,0)"><text x="35" y="38" font-size="23.400000000000002" fill="black">BOTTLE FILLER / 05 / Panel layout, dimensions in mm</text><text x="35" y="68" font-size="13.0" fill="black">Revision B | Jack Lai | Simulation / engineering study | 2026-11-05</text><text x="35" y="850" font-size="13.0" fill="black">E1: 600 H x 400 W x 200 D steel. Coordinates below are millimetres from backplate upper-left.</text><text x="35" y="875" font-size="13.0" fill="black">Main power left; 24 V control right. Separate duct routes. DIN rails at y=100, 290, 460 mm.</text><text x="35" y="900" font-size="13.0" fill="black">Envelopes include conservative planning sizes; verify final vendor drawings and wiring clearances before build.</text><text x="35" y="925" font-size="13.0" fill="black">PS1: reserve 40 mm above, 20 below per mounting guidance. Keep fan intake and upper outlet clear.</text><text x="35" y="950" font-size="13.0" fill="black">Door: S0, S1, S2, S3 and H1, 30 mm envelopes. Bond door to PE. No mains devices on door.</text><text x="35" y="975" font-size="13.0" fill="black">REV B: added B1 fan, EF1/EF2 outlets and F5 fuse after 40 C ambient check. Redline: drawings/revisions/.</text><path d="M35,825 L1390,825" fill="none" stroke="black" stroke-width="1.3"/><text x="35" y="1025" font-size="11.700000000000001" fill="black">Reference conductors by net name across sheets. Crossings have no junction unless they share a terminal.</text><rect x="100" y="90" width="400" height="600" fill="none" stroke="black"/><text x="100" y="720" font-size="14.3" fill="black">Backplate: 400 W x 600 H; enclosure depth 200</text><path d="M135,190 L470,190" fill="none" stroke="black" stroke-width="1.3" stroke-dasharray="5 4"/><path d="M135,380 L470,380" fill="none" stroke="black" stroke-width="1.3" stroke-dasharray="5 4"/><path d="M135,550 L470,550" fill="none" stroke="black" stroke-width="1.3" stroke-dasharray="5 4"/><rect x="120" y="105" width="360" height="20" fill="none" stroke="gray"/><rect x="120" y="285" width="360" height="25" fill="none" stroke="gray"/><rect x="120" y="490" width="360" height="25" fill="none" stroke="gray"/><rect x="305" y="140" width="25" height="500" fill="none" stroke="gray"/><rect x="650" y="90" width="400" height="600" fill="none" stroke="black"/><text x="650" y="720" font-size="14.3" fill="black">Door: 400 W x 600 H; bond to PE</text><rect x="1080" y="90" width="200" height="600" fill="none" stroke="black"/><text x="1080" y="720" font-size="14.3" fill="black">Side: 200 D x 600 H</text><text x="1105" y="300" font-size="14.3" fill="black">EF1 OUT</text><text x="1105" y="470" font-size="14.3" fill="black">EF2 OUT</text><text x="1105" y="665" font-size="14.3" fill="black">B1 IN</text><text x="660" y="450" font-size="14.3" fill="black">Minimum reserved wiring zones:</text><text x="660" y="478" font-size="13.0" fill="black">power left / DC right of centre duct</text><text x="660" y="506" font-size="13.0" fill="black">PS1: 40 mm top, 20 mm bottom</text><text x="660" y="534" font-size="13.0" fill="black">Bottom cable entry; 25 mm duct</text><rect x="1090" y="500" width="150" height="160" fill="none" stroke="red"/><rect x="1115" y="155" width="127" height="127" fill="none" stroke="red"/><rect x="1115" y="325" width="127" height="127" fill="none" stroke="red"/><rect x="390" y="515" width="28" height="95" fill="none" stroke="red"/><text x="1090" y="785" font-size="13.0" fill="red">B: added fan + outlet + F5</text></g></g></svg>
