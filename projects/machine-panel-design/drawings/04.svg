.3"/><text x="3" y="37" font-size="9.1" fill="black">9i</text><path d="M122,42 L110,42" fill="none" stroke="black" stroke-width="1.3"/><text x="62" y="37" font-size="9.1" fill="black">9</text><path d="M0,42 L110,42" fill="none" stroke="black" stroke-width="1.3"/></g><g transform="translate(1160,540)"><rect x="0" y="0" width="100" height="70" fill="none" stroke="black"/><text x="7" y="13" font-size="10.4" fill="black">0V / 02</text><path d="M-12,42 L0,42" fill="none" stroke="black" stroke-width="1.3"/><text x="3" y="37" font-size="9.1" fill="black">0V</text></g><g transform="translate(780,650)"><rect x="0" y="0" width="130" height="76" fill="none" stroke="black"/><text x="7" y="18" font-size="13.0" fill="black">H1</text><path d="M-12,42 L0,42" fill="none" stroke="black" stroke-width="1.3"/><text x="3" y="37" font-size="9.1" fill="black">+</text><path d="M142,42 L130,42" fill="none" stroke="black" stroke-width="1.3"/><text x="82" y="37" font-size="9.1" fill="black">-</text><ellipse cx="65.0" cy="39.0" rx="14.0" ry="14.0" fill="none" stroke="black"/><text x="57.0" y="45" font-size="11.700000000000001" fill="black">X</text></g><g transform="translate(470,650)"><rect x="0" y="0" width="110" height="70" fill="none" stroke="black"/><text x="7" y="18" font-size="13.0" fill="black">X2</text><path d="M-12,42 L0,42" fill="none" stroke="black" stroke-width="1.3"/><text x="3" y="37" font-size="9.1" fill="black">10i</text><path d="M122,42 L110,42" fill="none" stroke="black" stroke-width="1.3"/><text x="62" y="37" font-size="9.1" fill="black">10</text><path d="M0,42 L110,42" fill="none" stroke="black" stroke-width="1.3"/></g><g transform="translate(1020,650)"><rect x="0" y="0" width="100" height="70" fill="none" stroke="black"/><text x="7" y="13" font-size="10.4" fill="black">0V / 02</text><path d="M-12,42 L0,42" fill="none" stroke="black" stroke-width="1.3"/><text x="3" y="37" font-size="9.1" fill="black">0V</text></g><g transform="translate(950,540)"><rect x="0" y="0" width="110" height="70" fill="none" stroke="black"/><text x="7" y="18" font-size="13.0" fill="black">X2</text><path d="M-12,42 L0,42" fill="none" stroke="black" stroke-width="1.3"/><text x="3" y="37" font-size="9.1" fill="black">13i</text><path d="M122,42 L110,42" fill="none" stroke="black" stroke-width="1.3"/><text x="62" y="37" font-size="9.1" fill="black">13</text><path d="M0,42 L110,42" fill="none" stroke="black" stroke-width="1.3"/></g><g transform="translate(0,0)"><text x="35" y="38" font-size="23.400000000000002" fill="black">BOTTLE FILLER / 04 / Hardwired inhibit and PLC relay outputs</text><text x="35" y="68" font-size="13.0" fill="black">Revision B | Jack Lai | Simulation / engineering study | 2026-11-05</text><text x="35" y="850" font-size="13.0" fill="black">24CTL -&gt; S0 NC -&gt; S3 NC -&gt; OL1 95-96 NC -&gt; A1 C3. Opening any contact removes Y1-Y4 load supply.</text><text x="35" y="875" font-size="13.0" fill="black">A1 relay group C3 supplies Y1-Y4; C4 (Y5/Y6) unused. Y4/Y5/Y6 are spare and unconnected.</text><text x="35" y="900" font-size="13.0" fill="black">Y1 energizes K1 coil (A1/A2), Y2 opens YV1, Y3 lights H1. All loads return to 0 V.</text><text x="35" y="925" font-size="13.0" fill="black">K1 BD has built-in suppression. YV1 diode cathode at +24. X2:11/12 sensor power; X2:13 valve return.</text><text x="35" y="950" font-size="13.0" fill="black">Start latches a cycle; bottle stops conveyor and starts a 2 s fill. Stop/enable/overload aborts; reset then start.</text><text x="35" y="975" font-size="13.0" fill="black">No automatic restart. See python3 -m panel simulate for executable timing and fault sequence.</text><path d="M35,825 L1390,825" fill="none" stroke="black" stroke-width="1.3"/><text x="35" y="1025" font-size="11.700000000000001" fill="black">Reference conductors by net name across sheets. Crossings have no junction unless they share a terminal.</text></g><path d="M167,142 L238,142" fill="none" stroke="black" stroke-width="1.4"/><circle cx="167" cy="142" r="2.1" fill="black"/><circle cx="238" cy="142" r="2.1" fill="black"/><text x="202.5" y="137" font-size="9" fill="#444">24CTL</text><path d="M392,142 L468,142" fill="none" stroke="black" stroke-width="1.4"/><circle cx="392" cy="142" r="2.1" fill="black"/><circle cx="468" cy="142" r="2.1" fill="black"/><text x="430.0" y="137" font-size="9" fill="#444">EN1</text><path d="M622,142 L698,142" fill="none" stroke="black" stroke-width="1.4"/><circle cx="622" cy="142" r="2.1" fill="black"/><circle cx="698" cy="142" r="2.1" fill="black"/><text x="660.0" y="137" font-size="9" fill="#444">EN2</text><path d="M852,142 L918,142" fill="none" stroke="black" stroke-width="1.4"/><circle cx="852" cy="142" r="2.1" fill="black"/><circle cx="918" cy="142" r="2.1" fill="black"/><text x="885.0" y="137" font-size="9" fill="#444">24EN</text><path d="M1082,142 L1170,142 L1170,385 L430,385 L430,472 L458,472" fill="none" stroke="black" stroke-width="1.4"/><circle cx="1082" cy="142" r="2.1" fill="black"/><circle cx="458" cy="472" r="2.1" fill="black"/><path d="M592,472 L768,472" fill="none" stroke="black" stroke-width="1.4"/><circle cx="592" cy="472" r="2.1" fill="black"/><circle cx="768" cy="472" r="2.1" fill="black"/><text x="680.0" y="467" font-size="9" fill="#444">DO-Y1</text><path d="M922,472 L1008,472" fill="none" stroke="black" stroke-width="1.4"/><circle cx="922" cy="472" r="2.1" fill="black"/><circle cx="1008" cy="472" r="2.1" fill="black"/><text x="965.0" y="467" font-size="9" fill="#444">0V</text><path d="M1082,170 L1205,170 L1205,393 L412,393 L412,582 L458,582" fill="none" stroke="black" stroke-width="1.4"/><circle cx="1082" cy="170" r="2.1" fill="black"/><circle cx="458" cy="582" r="2.1" fill="black"/><path d="M592,582 L768,582" fill="none" stroke="black" stroke-width="1.4"/><circle cx="592" cy="582" r="2.1" fill="black"/><circle cx="768" cy="582" r="2.1" fill="black"/><text x="680.0" y="577" font-size="9" fill="#444">DO-Y2</text><path d="M922,582 L1072,582" fill="none" stroke="black" stroke-width="1.4"/><circle cx="922" cy="582" r="2.1" fill="black"/><circle cx="1072" cy="582" r="2.1" fill="black"/><text x="997.0" y="577" font-size="9" fill="#444">0V</text><path d="M938,582 L1148,582" fill="none" stroke="black" stroke-width="1.4"/><circle cx="938" cy="582" r="2.1" fill="black"/><circle cx="1148" cy="582" r="2.1" fill="black"/><text x="1043.0" y="577" font-size="9" fill="#444">0V</text><path d="M1082,198 L1240,198 L1240,401 L394,401 L394,692 L458,692" fill="none" stroke="black" stroke-width="1.4"/><circle cx="1082" cy="198" r="2.1" fill="black"/><circle cx="458" cy="692" r="2.1" fill="black"/><path d="M592,692 L768,692" fill="none" stroke="black" stroke-width="1.4"/><circle cx="592" cy="692" r="2.1" fill="black"/><circle cx="768" cy="692" r="2.1" fill="black"/><text x="680.0" y="687" font-size="9" fill="#444">DO-Y3</text><path d="M922,692 L1008,692" fill="none" stroke="black" stroke-width="1.4"/><circle cx="922" cy="692" r="2.1" fill="black"/><circle cx="1008" cy="692" r="2.1" fill="black"/><text x="965.0" y="687" font-size="9" fill="#444">0V</text></g></svg>
