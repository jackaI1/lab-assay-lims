[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ecg-lifecycle"
version = "0.1.0"
description = "An offline ECG screening and lifecycle learning exercise"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wfdb==4.3.1",
    "numpy==2.2.6",
    "scipy==1.16.3",
    "pandas==2.2.3",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[project.scripts]
ecg-lifecycle = "ecg_lifecycle.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: real public MIT-BIH data; requires download"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/ecg_lifecycle"]
