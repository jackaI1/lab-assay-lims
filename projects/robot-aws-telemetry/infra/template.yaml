AWSTemplateFormatVersion: '2010-09-09'
Description: Robot status ingestion and durable storage
Resources:
  EventBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  DeadLetterQueue:
    Type: AWS::SQS::Queue
  EventQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 5
  RuleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: iot.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendTelemetry
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt EventQueue.Arn
  StatusRule:
    Type: AWS::IoT::TopicRule
    Properties:
      TopicRulePayload:
        AwsIotSqlVersion: '2016-03-23'
        Sql: "SELECT * FROM 'robots/status'"
        RuleDisabled: false
        Actions:
          - Sqs:
              QueueUrl: !Ref EventQueue
              RoleArn: !GetAtt RuleRole.Arn
              UseBase64: false
Outputs:
  Bucket: { Value: !Ref EventBucket }
  QueueUrl: { Value: !Ref EventQueue }
