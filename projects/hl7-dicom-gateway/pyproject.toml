[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hl7-dicom-gateway"
version = "0.1.0"
description = "Synthetic-data HL7 v2 to FHIR R4 and de-identified DICOM gateway"
requires-python = ">=3.11"
dependencies = [
  "fhir.resources==6.5.0", "pydantic>=1.10.24,<2",
  "hl7>=0.4.5,<0.5", "httpx>=0.28,<0.29",
  "pydicom>=3.0,<4", "pynetdicom>=3.0,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.14,<1", "build>=1,<2"]

[project.scripts]
gateway = "gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["orthanc: requires live Orthanc at ORTHANC_URL"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
