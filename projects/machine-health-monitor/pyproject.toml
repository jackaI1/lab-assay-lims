[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "machine-health-monitor"
version = "0.1.0"
description = "OPC UA filling-line health monitor with visible data quality and persistent alerts"
requires-python = ">=3.11"
dependencies = ["asyncua>=1.1.8,<2", "fastapi>=0.115,<0.129", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8", "httpx>=0.28,<1", "playwright>=1.49,<2", "ruff>=0.11,<1"]

[project.scripts]
machine-health = "machine_health.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/machine_health"]
