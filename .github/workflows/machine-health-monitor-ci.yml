name: machine-health-monitor / Monitor checks
on:
  push:
    branches:
    - main
    paths:
    - projects/machine-health-monitor/**
    - .github/workflows/machine-health-monitor-ci.yml
  pull_request:
    paths:
    - projects/machine-health-monitor/**
    - .github/workflows/machine-health-monitor-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python:
        - '3.11'
        - '3.13'
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python }}
        enable-cache: true
        working-directory: projects/machine-health-monitor
    - run: uv sync --frozen --extra dev
    - run: uv run playwright install --with-deps chromium
    - run: uv run ruff check src tests
    - run: uv run ruff format --check src tests
    - run: uv run pytest --cov=machine_health --cov-report=term-missing --cov-report=xml --cov-fail-under=85
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-python-${{ matrix.python }}
        path: projects/machine-health-monitor/coverage.xml
defaults:
  run:
    working-directory: projects/machine-health-monitor
