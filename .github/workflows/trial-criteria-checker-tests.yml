name: trial-criteria-checker / Tests and saved reports
on:
  push:
    branches:
    - main
    paths:
    - projects/trial-criteria-checker/**
    - .github/workflows/trial-criteria-checker-tests.yml
  pull_request:
    paths:
    - projects/trial-criteria-checker/**
    - .github/workflows/trial-criteria-checker-tests.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python:
        - '3.9'
        - '3.12'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - name: Run all tests
      run: python -m unittest discover -s tests -v
    - name: Verify published results without a network call
      run: python scripts/reproduce.py --check
    timeout-minutes: 20
defaults:
  run:
    working-directory: projects/trial-criteria-checker
