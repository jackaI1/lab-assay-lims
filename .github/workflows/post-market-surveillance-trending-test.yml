name: post-market-surveillance-trending / Tests
on:
  push:
    branches:
    - main
    paths:
    - projects/post-market-surveillance-trending/**
    - .github/workflows/post-market-surveillance-trending-test.yml
  pull_request:
    paths:
    - projects/post-market-surveillance-trending/**
    - .github/workflows/post-market-surveillance-trending-test.yml
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m unittest discover -s tests -v
    - run: python -m surveillance --complaints data/complaints.csv --exposure data/exposure.csv --hazards data/hazards.csv
        --output /tmp/report.json --record-id PMS-001 --revision 1 --owner reviewer
    timeout-minutes: 20
permissions:
  contents: read
defaults:
  run:
    working-directory: projects/post-market-surveillance-trending
