name: ros2-nav2-slam-sim / simulation
on:
  push:
    branches:
    - main
    paths:
    - projects/ros2-nav2-slam-sim/**
    - .github/workflows/ros2-nav2-slam-sim-simulation.yml
  pull_request:
    paths:
    - projects/ros2-nav2-slam-sim/**
    - .github/workflows/ros2-nav2-slam-sim-simulation.yml
  workflow_dispatch: {}
concurrency:
  group: simulation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gazebo:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        seed:
        - 7
        - 19
        - 42
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v4
    - name: Build the ROS 2 environment
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64
        load: true
        tags: lab-patrol
        cache-from: type=gha,scope=lab-humble
        cache-to: type=gha,scope=lab-humble,mode=max,ignore-error=true
    - name: Unit, launch and complete simulator tests
      run: "mkdir -p artifacts\ndocker run --name lab-patrol-${{ matrix.seed }} --rm --init \\\n  -v \"$PWD/artifacts:/ws/src/lab_patrol/artifacts\"\
        \ \\\n  lab-patrol bash scripts/ci.sh ${{ matrix.seed }}\n"
    - name: Stop owned container on cancellation or failure
      if: always()
      run: docker stop -t 20 lab-patrol-${{ matrix.seed }} 2>/dev/null || true
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: gazebo-seed-${{ matrix.seed }}
        path: projects/ros2-nav2-slam-sim/artifacts/
        retention-days: 14
defaults:
  run:
    working-directory: projects/ros2-nav2-slam-sim
