name: calibration-inspection-log / Tests and demo
on:
  push:
    branches:
    - main
    paths:
    - projects/calibration-inspection-log/**
    - .github/workflows/calibration-inspection-log-ci.yml
  pull_request:
    paths:
    - projects/calibration-inspection-log/**
    - .github/workflows/calibration-inspection-log-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.10'
        - '3.12'
        - '3.13'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - run: python -m pip install -e '.[dev]'
    - run: python -m pytest -q
    - run: ruff check .
    - run: ruff format --check .
    - name: Generate synthetic records and Excel report
      if: matrix.python == '3.12'
      run: inspection-log demo --output outputs/demo
    - uses: actions/upload-artifact@v4
      if: matrix.python == '3.12'
      with:
        name: synthetic-demo
        path: projects/calibration-inspection-log/outputs/demo/
        if-no-files-found: error
    timeout-minutes: 20
defaults:
  run:
    working-directory: projects/calibration-inspection-log
