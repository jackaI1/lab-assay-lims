name: openusd-factory-cell / CI
on:
  push:
    branches:
    - main
    paths:
    - projects/openusd-factory-cell/**
    - .github/workflows/openusd-factory-cell-ci.yml
  pull_request:
    paths:
    - projects/openusd-factory-cell/**
    - .github/workflows/openusd-factory-cell-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.11'
        - '3.12'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
        cache: pip
    - name: Install dependencies
      run: python -m pip install -e '.[dev]'
    - name: Lint Python sources
      run: ruff check .
    - name: Validate Azure pipeline schema
      run: python scripts/validate_pipeline.py
    - name: Test with JUnit and coverage
      run: bash scripts/test.sh
    - name: Upload test reports even after failures
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: reports-python${{ matrix.python }}
        path: projects/openusd-factory-cell/reports/
        if-no-files-found: error
    - name: Build and test installed wheel
      run: bash scripts/build-wheel.sh dist
    - name: Generate and validate a portable animated cell
      run: 'factory-cell generate --output build/ci-cell --fixture nest --seconds 12 --fps 30

        factory-cell validate build/ci-cell/cell.usda

        factory-cell inspect build/ci-cell/cell.usda

        '
    - name: Upload generated cell
      uses: actions/upload-artifact@v4
      with:
        name: factory-cell-python${{ matrix.python }}
        path: projects/openusd-factory-cell/build/ci-cell
        if-no-files-found: error
    - name: Upload wheel
      uses: actions/upload-artifact@v4
      with:
        name: wheel-python${{ matrix.python }}
        path: projects/openusd-factory-cell/dist/*.whl
        if-no-files-found: error
    timeout-minutes: 20
defaults:
  run:
    working-directory: projects/openusd-factory-cell
