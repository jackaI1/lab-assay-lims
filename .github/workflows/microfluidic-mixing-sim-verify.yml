name: microfluidic-mixing-sim / Verify simulation
on:
  push:
    branches:
    - main
    paths:
    - projects/microfluidic-mixing-sim/**
    - .github/workflows/microfluidic-mixing-sim-verify.yml
  pull_request:
    paths:
    - projects/microfluidic-mixing-sim/**
    - .github/workflows/microfluidic-mixing-sim-verify.yml
  workflow_dispatch: {}
jobs:
  finite-element-study:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash -el {0}
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
    - uses: actions/checkout@v4
    - uses: mamba-org/setup-micromamba@v2
      with:
        environment-file: environment.yml
        cache-environment: true
    - run: python -m pytest -q
    - run: python -m mixing.study --coarse --output ci-results
    - uses: actions/upload-artifact@v4
      with:
        name: coarse-study
        path: projects/microfluidic-mixing-sim/ci-results/
permissions:
  contents: read
defaults:
  run:
    working-directory: projects/microfluidic-mixing-sim
