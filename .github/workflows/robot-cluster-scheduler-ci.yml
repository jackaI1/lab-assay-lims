name: robot-cluster-scheduler / Tests
on:
  push:
    branches:
    - main
    paths:
    - projects/robot-cluster-scheduler/**
    - .github/workflows/robot-cluster-scheduler-ci.yml
  pull_request:
    paths:
    - projects/robot-cluster-scheduler/**
    - .github/workflows/robot-cluster-scheduler-ci.yml
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python:
        - '3.9'
        - '3.12'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - run: python -m pip install '.[test]'
    - run: python -m pytest -q
    - run: python -m robot_scheduler --seed 42 --batches 12 > /dev/null
    timeout-minutes: 20
permissions:
  contents: read
defaults:
  run:
    working-directory: projects/robot-cluster-scheduler
