name: plc-control-panel-design / Check electrical design
on:
  push:
    branches:
    - main
    paths:
    - projects/plc-control-panel-design/**
    - .github/workflows/plc-control-panel-design-ci.yml
  pull_request:
    paths:
    - projects/plc-control-panel-design/**
    - .github/workflows/plc-control-panel-design-ci.yml
  workflow_dispatch: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install KiCad
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends kicad
    - name: Export connectivity from editable sheets
      run: "for f in design/*.kicad_sch; do\n  kicad-cli sch export netlist --format kicadxml -o \"${f%.kicad_sch}.xml\" \"\
        $f\"\ndone\n"
    - run: python3 scripts/check_io.py
    - run: python3 -m unittest discover -s tests -v
    timeout-minutes: 20
permissions:
  contents: read
defaults:
  run:
    working-directory: projects/plc-control-panel-design
