name: chart-send-extension / Verify chart send
on:
  push:
    branches:
    - main
    paths:
    - projects/chart-send-extension/**
    - .github/workflows/chart-send-extension-ci.yml
  pull_request:
    paths:
    - projects/chart-send-extension/**
    - .github/workflows/chart-send-extension-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: projects/chart-send-extension/package-lock.json
    - run: npm ci
    - run: npx playwright install --with-deps chromium
    - run: npm run check
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: fixture-diagnostics
        path: projects/chart-send-extension/test-results/
        retention-days: 3
  openemr:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: projects/chart-send-extension/package-lock.json
    - run: npm ci
    - run: npx playwright install --with-deps chromium
    - run: docker compose up -d
    - run: node scripts/wait-openemr.mjs
    - run: npm run demo:seed
    - run: npm run build
    - run: npm run test:e2e
      env:
        OPENEMR: '1'
    - name: Bounded startup diagnostics
      if: failure()
      run: docker compose logs --tail=60
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: openemr-fictional-demo
        path: projects/chart-send-extension/test-results/
        retention-days: 3
    - name: Remove disposable demo
      if: always()
      run: docker compose down -v --remove-orphans
defaults:
  run:
    working-directory: projects/chart-send-extension
