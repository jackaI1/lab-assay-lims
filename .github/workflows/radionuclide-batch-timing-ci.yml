name: radionuclide-batch-timing / Simulator checks
on:
  push:
    branches:
    - main
    paths:
    - projects/radionuclide-batch-timing/**
    - .github/workflows/radionuclide-batch-timing-ci.yml
  pull_request:
    paths:
    - projects/radionuclide-batch-timing/**
    - .github/workflows/radionuclide-batch-timing-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
        - '3.11'
        - '3.12'
        - '3.13'
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        working-directory: projects/radionuclide-batch-timing
    - run: uv sync --locked --extra dev
    - run: uv run pytest -q
    - run: uv run ruff check .
    - run: uv run ruff format --check .
    - run: uv run python scripts/regenerate_reports.py --check
    - run: uv build
    timeout-minutes: 20
defaults:
  run:
    working-directory: projects/radionuclide-batch-timing
