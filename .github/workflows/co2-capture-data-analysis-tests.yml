name: co2-capture-data-analysis / tests
on:
  push:
    branches:
    - main
    paths:
    - projects/co2-capture-data-analysis/**
    - .github/workflows/co2-capture-data-analysis-tests.yml
  pull_request:
    paths:
    - projects/co2-capture-data-analysis/**
    - .github/workflows/co2-capture-data-analysis-tests.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
        - '3.10'
        - '3.12'
        - '3.13'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - run: python -m pip install -e '.[dev]'
    - run: ruff check .
    - run: pytest -q
    - run: 'co2-analyze demo demo-runs

        co2-analyze batch demo-runs/manifest.json --output results

        '
    - uses: actions/upload-artifact@v4
      with:
        name: demo-results-python-${{ matrix.python }}
        path: projects/co2-capture-data-analysis/results/
    timeout-minutes: 20
defaults:
  run:
    working-directory: projects/co2-capture-data-analysis
