name: eeg-session-qc / checks
on:
  push:
    branches:
    - main
    paths:
    - projects/eeg-session-qc/**
    - .github/workflows/eeg-session-qc-ci.yml
  pull_request:
    paths:
    - projects/eeg-session-qc/**
    - .github/workflows/eeg-session-qc-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        version: 0.9.9
        working-directory: projects/eeg-session-qc
    - run: uv sync --locked --python 3.12
    - run: uv run ruff check src tests scripts
    - run: uv run ruff format --check src tests scripts
    - run: uv run pytest -q
    - uses: actions/cache@v4
      with:
        path: projects/eeg-session-qc/data
        key: physionet-${{ hashFiles('src/eeg_session_qc/sources.json') }}
    - run: uv run eeg-qc demo --output /tmp/eeg-qc-reproduced
    - run: uv run pytest -q
    - run: uv run python scripts/check_evidence.py /tmp/eeg-qc-reproduced
    - run: uv run python -m eeg_session_qc.imagery --subjects 2 8 11 --output /tmp/eeg-imagery
    - run: uv build
    - uses: actions/upload-artifact@v4
      with:
        name: public-eeg-reports
        path: projects/eeg-session-qc//tmp/eeg-qc-reproduced
defaults:
  run:
    working-directory: projects/eeg-session-qc
