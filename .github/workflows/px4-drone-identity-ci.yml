name: px4-drone-identity / Simulation and identity checks
on:
  push:
    branches:
    - main
    paths:
    - projects/px4-drone-identity/**
    - .github/workflows/px4-drone-identity-ci.yml
  pull_request:
    paths:
    - projects/px4-drone-identity/**
    - .github/workflows/px4-drone-identity-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: identity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install -e '.[test]'
    - run: pytest -q
    - run: ruff check src tests
    - run: c++ -std=c++14 -Wall -Wextra -Werror -Wfloat-equal -I px4/identity_guard tests/guard_test.cpp -o /tmp/guard-test
        && /tmp/guard-test
    timeout-minutes: 20
  gazebo:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Cache PX4 and Gazebo toolchain
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile
        target: toolchain
        cache-from: type=gha,scope=toolchain
        cache-to: type=gha,scope=toolchain,mode=max
    - name: Compile and cache PX4 with identity module
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile
        target: firmware
        cache-from: 'type=gha,scope=toolchain

          type=gha,scope=firmware

          '
        cache-to: type=gha,scope=firmware,mode=max
    - uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile
        load: true
        tags: px4-identity:ci
        cache-from: 'type=gha,scope=toolchain

          type=gha,scope=firmware

          type=gha,scope=simulator

          '
        cache-to: type=gha,scope=simulator,mode=max
    - name: Fly all eight experiments
      run: "mkdir -p results\ntimeout 15m docker run --init --name px4-identity-${{ github.run_id }}-${{ github.run_attempt\
        \ }} \\\n  --shm-size=256m -v \"$PWD/results:/results\" px4-identity:ci\n"
    - name: Stop and verify owned container
      if: always()
      run: "container=px4-identity-${{ github.run_id }}-${{ github.run_attempt }}\nif docker container inspect \"$container\"\
        \ >/dev/null 2>&1; then\n  docker stop --time 10 \"$container\" >/dev/null\n  docker inspect --format 'owned container:\
        \ running={{.State.Running}} pid={{.State.Pid}} exit={{.State.ExitCode}}' \"$container\"\n  docker rm \"$container\"\
        \ >/dev/null\n  test -z \"$(docker ps -aq --filter name=^/${container}$)\"\nfi\n"
    - name: Show bounded failure context
      if: failure()
      run: 'test ! -f results/experiments.jsonl || tail -n 2 results/experiments.jsonl

        test ! -f results/px4.log || tail -n 45 results/px4.log

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: flight-evidence
        path: projects/px4-drone-identity/results/
        if-no-files-found: ignore
        retention-days: 14
defaults:
  run:
    working-directory: projects/px4-drone-identity
