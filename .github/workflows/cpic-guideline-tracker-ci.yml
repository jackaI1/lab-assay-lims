name: cpic-guideline-tracker / Offline checks
on:
  push:
    branches:
    - main
    paths:
    - projects/cpic-guideline-tracker/**
    - .github/workflows/cpic-guideline-tracker-ci.yml
  pull_request:
    paths:
    - projects/cpic-guideline-tracker/**
    - .github/workflows/cpic-guideline-tracker-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python:
        - '3.9'
        - '3.13'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - name: Run fixture and saved evidence tests without network
      run: python -m unittest discover -v
    - name: Check the documented offline commands
      run: 'python -m cpic_tracker stats snapshots/api-2026-11-05.json

        python -m cpic_tracker compare snapshots/release-v1.57.0.json snapshots/release-v1.61.0.json --output /tmp/cpic-report.md

        diff -u reports/release-changes.md /tmp/cpic-report.md

        python -m cpic_tracker lookup snapshots/release-v1.61.0.json --drug voriconazole --phenotype ''CYP2C19=Poor Metabolizer''
        --population adults > /tmp/cpic-lookup.json

        diff -u reports/lookup-example.json /tmp/cpic-lookup.json

        '
    timeout-minutes: 20
defaults:
  run:
    working-directory: projects/cpic-guideline-tracker
