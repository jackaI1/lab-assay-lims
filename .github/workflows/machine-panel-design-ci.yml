name: machine-panel-design / Panel checks
on:
  push:
    branches:
    - main
    paths:
    - projects/machine-panel-design/**
    - .github/workflows/machine-panel-design-ci.yml
  pull_request:
    paths:
    - projects/machine-panel-design/**
    - .github/workflows/machine-panel-design-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
        - '3.10'
        - '3.13'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - run: python -m unittest discover -s tests -v
    - run: python -m panel build --check
    - run: python -m panel simulate
    timeout-minutes: 20
  qelectrotech:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: sudo apt-get update -qq && sudo apt-get install -y qelectrotech xvfb x11-utils
    - name: Native QElectroTech opens all five folios
      run: 'mkdir -p /tmp/qet-config

        xvfb-run -a python3 tests/native_smoke.py

        '
    timeout-minutes: 20
defaults:
  run:
    working-directory: projects/machine-panel-design
