name: lidar-slam-ekf-localization / Test and benchmark
on:
  push:
    branches:
    - main
    paths:
    - projects/lidar-slam-ekf-localization/**
    - .github/workflows/lidar-slam-ekf-localization-ci.yml
  pull_request:
    paths:
    - projects/lidar-slam-ekf-localization/**
    - .github/workflows/lidar-slam-ekf-localization-ci.yml
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -r requirements.txt
    - run: make test
    - run: make benchmark
    - uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: projects/lidar-slam-ekf-localization/results/
    timeout-minutes: 20
permissions:
  contents: read
defaults:
  run:
    working-directory: projects/lidar-slam-ekf-localization
