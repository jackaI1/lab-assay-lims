name: clinical-image-quality-gate / Tests and real-data reproduction
on:
  push:
    branches:
    - main
    paths:
    - projects/clinical-image-quality-gate/**
    - .github/workflows/clinical-image-quality-gate-ci.yml
  pull_request:
    paths:
    - projects/clinical-image-quality-gate/**
    - .github/workflows/clinical-image-quality-gate-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: qc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: '3.11'
        enable-cache: true
        working-directory: projects/clinical-image-quality-gate
    - run: uv sync --frozen
    - run: uv run ruff check .
    - run: uv run ruff format --check .
    - run: uv run pytest -q
    - name: Reproduce the frozen public-data experiment
      run: uv run image-qc reproduce --output /tmp/qc-reproduced
    - name: Compare fresh models and metrics with published evidence
      run: uv run python scripts/verify_evidence.py --report /tmp/qc-reproduced --expected reports
    - name: Verify README measurements are generated
      run: 'uv run python scripts/update_readme.py

        git diff --exit-code -- README.md

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: reproduced-report
        path: projects/clinical-image-quality-gate//tmp/qc-reproduced/
        if-no-files-found: ignore
defaults:
  run:
    working-directory: projects/clinical-image-quality-gate
