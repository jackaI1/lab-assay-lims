name: nestjs-supabase-rbac / Clinic access tests
on:
  push:
    branches:
    - main
    paths:
    - projects/nestjs-supabase-rbac/**
    - .github/workflows/nestjs-supabase-rbac-ci.yml
  pull_request:
    paths:
    - projects/nestjs-supabase-rbac/**
    - .github/workflows/nestjs-supabase-rbac-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: projects/nestjs-supabase-rbac/package-lock.json
    - run: npm ci
    - run: npm run verify
    - name: Ensure stack is stopped even if the runner is cancelled
      if: always()
      run: npx supabase stop --no-backup
defaults:
  run:
    working-directory: projects/nestjs-supabase-rbac
