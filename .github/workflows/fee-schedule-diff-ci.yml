name: fee-schedule-diff / checks
on:
  push:
    branches:
    - main
    paths:
    - projects/fee-schedule-diff/**
    - .github/workflows/fee-schedule-diff-ci.yml
  pull_request:
    paths:
    - projects/fee-schedule-diff/**
    - .github/workflows/fee-schedule-diff-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
        - '3.11'
        - '3.12'
        - '3.13'
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python }}
        enable-cache: true
        working-directory: projects/fee-schedule-diff
    - run: uv sync --frozen --extra dev
    - run: uv run ruff check .
    - run: uv run ruff format --check .
    - run: uv run pytest -q
    - run: uv build
    timeout-minutes: 20
  public-pdf-reproduction:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: '3.12'
        working-directory: projects/fee-schedule-diff
    - run: uv sync --frozen
    - run: uv run python scripts/reproduce.py
    - run: git diff --exit-code -- reports
    timeout-minutes: 20
defaults:
  run:
    working-directory: projects/fee-schedule-diff
