name: Assay checks
on:
  push:
    paths-ignore: ['projects/**']
    branches: [main]
  pull_request:
    paths-ignore: ['projects/**']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev --extra robot
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q --tb=short
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.11'
      - run: uv sync --locked --extra dev --extra browser
      - run: uv run playwright install --with-deps chromium
      - run: uv run python scripts/browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: playwright-artifacts/*.png
          if-no-files-found: ignore
