[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lab-assay-lims"
version = "0.1.0"
description = "Traceable plate assays and simulated OT-2 preparation"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.14",
    "uvicorn>=0.30,<1",
    "numpy>=1.26,<2",
    "scipy>=1.12,<2",
    "openpyxl>=3.1,<4",
    "python-multipart>=0.0.18,<1",
    "pyvisa>=1.14,<2",
    "pyvisa-sim>=0.7,<1",
    "statsmodels>=0.14,<1",
    "matplotlib>=3.8,<4",
    "pandas>=3.0.6",
    "pyvisa-py>=0.7,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.9,<1"]
robot = ["opentrons==8.8.2"]
browser = [
    "playwright>=1.49,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.hatch.build.targets.wheel]
packages = ["lab_assay"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
